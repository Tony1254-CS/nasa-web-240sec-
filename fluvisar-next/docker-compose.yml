version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - FLUVISAR_ASSISTANT_MODEL=${FLUVISAR_ASSISTANT_MODEL:-gemini-2.5-flash}
    restart: unless-stopped

